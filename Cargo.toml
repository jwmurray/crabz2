[package]
name = "crabz2"
version = "0.2.0"
edition = "2021"
rust-version = "1.63"
license = "MIT"
description = "Pure-Rust bzip2 decompression — own from-scratch decoder, no C, no libbz2, no third-party decode crate."
repository = "https://github.com/jwmurray/crabz2"
homepage = "https://github.com/jwmurray/crabz2"
readme = "README.md"
keywords = ["bzip2", "bz2", "decompression"]
categories = ["compression"]

[dependencies]

[features]
default = []
# Reserved for a rayon-backed parallel block decoder. Not yet implemented.
parallel = []

[package]
name = "crabz2"
version = "0.3.1"
edition = "2021"
rust-version = "1.63"
license = "MIT"
description = "Pure-Rust bzip2 compression and decompression — own from-scratch encoder and decoder, no C, no libbz2, no third-party bzip2 crate."
repository = "https://github.com/jwmurray/crabz2"
homepage = "https://github.com/jwmurray/crabz2"
readme = "README.md"
keywords = ["bzip2", "bz2", "compression", "decompression"]
categories = ["compression"]
# The cargo-fuzz crate is nightly-only and has its own dependencies; it is not
# part of the published package and not a member of this crate's build.
exclude = ["fuzz"]

[dependencies]

# Only used by the `courtlistener` example (a pure-Rust HTTPS client, rustls/no C).
# Dev-dependencies are NOT part of the published dependency graph for consumers.
[dev-dependencies]
ureq = { version = "2", default-features = false, features = ["tls"] }

[features]
default = ["std"]
# `std` adds the `io::Read` adapters (`reader`, `Crabz2Reader`, `decompress`) and
# `From<Error> for io::Error`. Without it the crate is `no_std + alloc`: the sans-io
# decoder and `decompress_to_vec` remain available.
std = []
# Reserved for a rayon-backed parallel block decoder. Not yet implemented.
parallel = []

# The examples are std-only CLIs; skip them under --no-default-features.
[[example]]
name = "crabz2"
required-features = ["std"]

[[example]]
name = "courtlistener"
required-features = ["std"]

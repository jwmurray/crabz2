[package]
name = "crabz2"
version = "0.6.0"
edition = "2021"
rust-version = "1.63"
license = "MIT"
description = "Pure-Rust bzip2 compression and decompression — no C, no libbz2, zero unsafe code by default — with a decoder that beats C libbz2 (and parallel lbzip2) in our benchmarks."
repository = "https://github.com/jwmurray/crabz2"
homepage = "https://github.com/jwmurray/crabz2"
readme = "README.md"
keywords = ["bzip2", "bz2", "compression", "decompression"]
categories = ["compression"]
# The cargo-fuzz crate is nightly-only and has its own dependencies; it is not
# part of the published package and not a member of this crate's build.
exclude = ["fuzz"]

# The published library is itself the workspace root, so nothing about how it
# builds, packages, or resolves changes. `crabz2-wasm` is the wasm-bindgen wrapper
# behind the npm package; it is a separate crate precisely so the dependency stays
# out of this one. `fuzz/` declares its own workspace and is not a member.
[workspace]
members = [".", "crabz2-wasm"]

# Intentionally empty: a default build of crabz2 has no runtime dependencies. The
# one optional dependency is declared in its own table below so this stays visibly so.
[dependencies]
bzip2 = { version = "0.4", optional = true }

# Pulled in only by the non-default `parallel` feature. 1.10 is the last release
# with rayon's own MSRV at 1.63, matching ours; newer minors resolve fine on newer
# toolchains and the MSRV gate never builds this feature.
[dependencies.rayon]
version = "1.10"
optional = true

# Dev-dependencies are NOT part of the published dependency graph for consumers.
# `ureq` is used only by the `courtlistener` example (pure-Rust HTTPS, rustls/no C);
# `criterion` and `bzip2` (C libbz2 bindings — the benchmark baseline) only by benches.
[dev-dependencies]
ureq = { version = "2", default-features = false, features = ["tls"] }
criterion = { version = "0.5", default-features = false, features = [
    "cargo_bench_support",
] }
bzip2 = "0.4"

# `test = true` makes `cargo test` build and smoke-run the bench binary (criterion's
# test mode: one iteration each), so the benchmarks cannot rot unnoticed in CI.
# Criterion itself needs `std`, so the bench is skipped under --no-default-features.
[[bench]]
name = "decode"
harness = false
test = true
required-features = ["std"]

[features]
default = ["std"]
# `std` adds the `io::Read` adapters (`reader`, `Crabz2Reader`, `decompress`) and
# `From<Error> for io::Error`. Without it the crate is `no_std + alloc`: the sans-io
# decoder and `decompress_to_vec` remain available.
std = []
# Rayon-backed parallel block decode: adds `decompress_parallel`. Additive and off by
# default — with it off the serial decoder compiles exactly as it does today.
parallel = ["dep:rayon", "std"]

# Optional C-backed libbz2 baseline used by the `examples/compare.rs` example.
libbz2 = ["bzip2"]

# Dev-only: per-phase timers inside `decode_block` (Phase A profiling). Never default.
phasetime = ["std"]

# The default build is zero-`unsafe`, enforced by `#![forbid(unsafe_code)]`. This
# feature opts the hot paths (IBWT threading, the permutation walk, parallel output
# assembly) back into their raw-pointer variants — identical output and errors; on
# the benchmarked Apple Silicon hardware the speed difference is within noise (see
# the README), so reach for this only after measuring on yours.
unsafe-fast = []

# The examples are std-only CLIs; skip them under --no-default-features.
[[example]]
name = "crabz2"
required-features = ["std"]

[[example]]
name = "courtlistener"
required-features = ["std"]

[[example]]
name = "parallel"
required-features = ["parallel"]

[[example]]
name = "compare"
required-features = ["libbz2", "parallel"]

name: fuzz

# A short smoke run, not a fuzzing campaign: enough to catch a target that no
# longer builds or an input in the committed corpus that now crashes. Real
# campaigns are run out of band and their findings land as corpus seeds.
on:
  pull_request:
    paths:
      - 'src/**'
      - 'fuzz/**'
      - '.github/workflows/fuzz.yml'
  schedule:
    # Mondays, 05:17 UTC.
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: fuzz targets (60s each)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install nightly
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            fuzz/target
          key: fuzz-${{ runner.os }}-${{ hashFiles('fuzz/Cargo.toml') }}

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Smoke run — fuzz_decompress
        run: >
          cargo fuzz run fuzz_decompress --
          -max_total_time=60
          -max_len=16384
          -rss_limit_mb=4096

      # A larger -max_len than the decode target on purpose: level 1 fills a
      # block at 100 kB of RLE1 output, and block boundaries are where a
      # streaming encoder goes wrong. -len_control=0 is what actually makes it
      # bite -- libFuzzer otherwise ramps the length up so gradually that a
      # short run never gets near the limit, and no second block is ever
      # emitted.
      - name: Smoke run — fuzz_roundtrip
        run: >
          cargo fuzz run fuzz_roundtrip --
          -max_total_time=60
          -max_len=150000
          -len_control=0
          -rss_limit_mb=4096

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore
